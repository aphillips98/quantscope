version: 1
name: a100
models:
- mistral-7b-instruct-v0.3-q8_0
hardware_profile: a100
repetitions: 5
seed: 42
capture_predictions: true
scoring:
- exact_match
benchmarks:
  mmlu:
    shots: 5
    tasks:
    - high_school_computer_science
  hellaswag:
    shots: 5
    tasks:
    - applying_sunscreen
telemetry:
  enabled: true
  require_energy: false
  sample_interval_seconds: 0.2
llamacpp:
  verbose: false
profiling:
  enabled: false
  mode: daemon
  library_path: ${HOME}/.local/programs/A100/nvidia-profiling/lib/nvidia-process-metrics/libnvidia-process-metrics.so
  launcher: nvidia-process-metrics-launcher
  device: 0
  window_ms: 10
  duration_seconds: 120
