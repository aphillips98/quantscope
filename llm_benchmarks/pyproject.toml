[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantscope-llm-benchmarks"
version = "0.1.0"
description = "Standalone, reproducible LLM benchmark runner for HPC systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
deepeval = ["deepeval>=2,<3", "pandas>=2", "datasets>=2,<4"]
transformers = ["torch>=2.2", "transformers>=4.40"]
vllm = ["vllm>=0.6"]
llamacpp = ["llama-cpp-python>=0.3"]
telemetry = ["pynvml>=11.5"]
dev = ["pytest>=8"]

[project.scripts]
qscope-bench = "quantscope_bench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]