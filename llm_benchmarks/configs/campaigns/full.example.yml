version: 1
name: full
model: hf-model
hardware_profile: a100
repetitions: 3
seed: 42
capture_predictions: false
scoring: [exact_match]
benchmarks:
  mmlu:
    shots: 5
  hellaswag:
    shots: 10
telemetry:
  require_energy: false
  sample_interval_seconds: 1.0
profiling:
  enabled: false
  mode: direct
  library_path: ${HOME}/.local/programs/A100/nvidia-profiling/lib/nvidia-process-metrics/libnvidia-process-metrics.so
  device: 0
  window_ms: 200